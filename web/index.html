<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>身份证到A4 PDF</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>身份证到A4 PDF</h1>
      <p>上传照片 → 调整裁剪 → 导出 PDF</p>
    </header>
    <div class="editor">
      <div class="card-pane">
        <h2>正面</h2>
        <div class="drop-area" id="frontDrop">
          <span class="hint">点击或拖拽上传</span>
          <input id="frontFile" type="file" accept="image/*" hidden />
        </div>
        <div id="frontStatus" class="status-msg"></div>
        <div class="expand-control">
          <label>边缘扩展: <span id="frontExpandValue">8%</span></label>
          <input id="frontExpand" type="range" min="0" max="30" value="8" step="1" />
        </div>
        <div class="canvas-wrap">
          <canvas id="frontCanvas" width="600" height="400"></canvas>
          <div class="zoom-bar">
            <button id="frontZoomOut">－</button>
            <span id="frontZoomText">100%</span>
            <button id="frontZoomIn">＋</button>
          </div>
        </div>
        <div class="controls">
          <label>旋转(°)<input id="frontRotate" type="range" min="-45" max="45" value="0" /></label>
          <button id="frontAutoLevel" class="btn-secondary">自动水平</button>
          <button id="frontReset" class="btn-secondary">重置</button>
          <button id="frontApply">应用</button>
        </div>
        <img id="frontResult" />
      </div>
      <div class="card-pane">
        <h2>反面</h2>
        <div class="drop-area" id="backDrop">
          <span class="hint">点击或拖拽上传</span>
          <input id="backFile" type="file" accept="image/*" hidden />
        </div>
        <div id="backStatus" class="status-msg"></div>
        <div class="expand-control">
          <label>边缘扩展: <span id="backExpandValue">8%</span></label>
          <input id="backExpand" type="range" min="0" max="30" value="8" step="1" />
        </div>
        <div class="canvas-wrap">
          <canvas id="backCanvas" width="600" height="400"></canvas>
          <div class="zoom-bar">
            <button id="backZoomOut">－</button>
            <span id="backZoomText">100%</span>
            <button id="backZoomIn">＋</button>
          </div>
        </div>
        <div class="controls">
          <label>旋转(°)<input id="backRotate" type="range" min="-45" max="45" value="0" /></label>
          <button id="backAutoLevel" class="btn-secondary">自动水平</button>
          <button id="backReset" class="btn-secondary">重置</button>
          <button id="backApply">应用</button>
        </div>
        <img id="backResult" />
      </div>
    </div>
    <div class="preview-pane">
      <h2>A4 预览</h2>
      <div class="a4-wrap">
        <canvas id="a4Canvas" width="420" height="700"></canvas>
      </div>

      <!-- 水印控制面板 -->
      <div class="watermark-panel">
        <div class="watermark-header">
          <label>
            <input type="checkbox" id="watermarkEnabled" />
            启用水印
          </label>
          <button id="watermarkPreset" class="btn-small">常用用途</button>
        </div>

        <div class="watermark-controls" id="watermarkControls">
          <div class="watermark-row">
            <label>水印文字</label>
            <input type="text" id="watermarkText" value="仅用于XX办理" placeholder="输入水印文字" />
          </div>

          <div class="watermark-row">
            <label>水印模式</label>
            <select id="watermarkMode">
              <option value="single">单个水印（居中）</option>
              <option value="tile" selected>满屏水印</option>
            </select>
          </div>

          <div class="watermark-row">
            <label>字体大小 <span id="watermarkSizeValue">48</span>pt</label>
            <input type="range" id="watermarkSize" min="12" max="120" value="48" />
          </div>

          <div class="watermark-row">
            <label>透明度 <span id="watermarkOpacityValue">30</span>%</label>
            <input type="range" id="watermarkOpacity" min="5" max="100" value="30" />
          </div>

          <div class="watermark-row">
            <label>颜色</label>
            <input type="color" id="watermarkColor" value="#ff0000" />
          </div>

          <div class="watermark-row">
            <label>旋转角度 <span id="watermarkRotationValue">-45</span>°</label>
            <input type="range" id="watermarkRotation" min="-90" max="90" value="-45" />
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="exportPdf" disabled>导出 PDF</button>
      </div>
  </div>
  <footer class="footer">
    <p>提示：本应用不会保存任何图片，处理完成后即删除。开源地址：<a href="https://github.com/sharkyc/idcard2pdf" target="_blank" rel="noopener">https://github.com/sharkyc/idcard2pdf</a></p>
    <div class="changelog">
      <strong>版本记录</strong>
      <ul>
        <li>v0.4 新增水印功能：支持自定义文字、大小、颜色、透明度、旋转角度；单水印和满屏两种模式；实时预览效果</li>
        <li>v0.3 优化裁切体验：实时预览、自动水平、边缘扩展、触摸优化</li>
        <li>v0.2 增加底部提示与GitHub链接；应用后自动横向长边</li>
        <li>v0.1 初始版本</li>
      </ul>
    </div>
  </footer>
  </div>
  <script src="/app.js"></script>
</body>
</html>
